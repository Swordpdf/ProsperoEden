name: Release build

# Builds the release ZIP (make release, which fetches pinned dependencies; docs/BUILDING.md) on a
# GitHub-hosted runner (ubuntu-24.04, no container). tools/ci/setup-ubuntu-24.04.sh installs the
# host tools: the packages in tools/ci/ubuntu-24.04-packages.txt, with LLVM 21 from apt.llvm.org
# beside Ubuntu's LLVM 18 (the versions the releases are built with on a developer machine, so
# the linker is the same and no link flag differs), Meson, and the SPIR-V LLVM translator.
#
# A pull request and a v* tag build by themselves; a build on main is started by hand (Actions >
# Release build > Run workflow). Every run builds the ZIP, checks it (intact, eboot.bin, every
# entry 0777) and keeps it as a 7-day artifact; only a v* tag also publishes it, as a pre-release.
# A tag's or a manual run's ZIP also gets a signed attestation of where it was built.
# The release's files come from this workflow: a release that already exists for the tag gets
# them when it has no ZIP yet, and keeps its own (with a warning) when it has one.
#
# Downloads, ccache and the RADV driver are cached between runs. A build with these caches takes
# about ten minutes; one without them compiles everything on four cores and takes about an hour.
# Should a build ever reach the build step's limit (315 minutes), ccache is still saved: running
# the workflow again continues from there.
# GitHub drops a cache nobody used for a week, and a pull request only sees the caches of main.
# So ccache has a second source: a snapshot kept as a file of the `build-cache` release, which
# any run downloads when it finds no ccache. A manual run on main with "snapshot" ticked keeps
# its ccache as an artifact, which build-cache.yml publishes as the new snapshot.
# The actions are the Node 24 versions, pinned by commit.
on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Also publish this run's ccache as the build-cache snapshot (run it on main)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request, or a newer manual run on the same branch, replaces the run in
# progress; a tag's run is never cancelled.
concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    # The job's own list (it replaces the workflow's): reading the source, and signing the
    # ZIP's attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      CCACHE_MAXSIZE: 4G
    steps:
      # SDKs preinstalled on the runner that this build does not use: the build (Eden, Mesa,
      # FFmpeg and their caches) needs the disk space.
      - name: Free disk space
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby
          df -h "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Locate the caches
        run: |
          # Beside the checkout, on the runner's disk; the paths stay the same between runs.
          cache_root=$(dirname "$GITHUB_WORKSPACE")/ci-cache
          mkdir -p "$cache_root"
          {
            echo "CACHE_ROOT=$cache_root"
            echo "RADV_NATIVE=$(dirname "$GITHUB_WORKSPACE")/mihawk-vulkan-review/.deps/native"
            echo "PROSPEROEDEN_DEPS_CACHE=$cache_root/downloads"
            echo "CCACHE_DIR=$cache_root/ccache"
            echo "XDG_CACHE_HOME=$cache_root/xdg"
            echo "JOBS=$(nproc)"
            echo "RADV_BUILD_JOBS=$(nproc)"
            echo "SPIRV_TRANSLATOR=$cache_root/spirv-llvm-translator"
          } >> "$GITHUB_ENV"

      # Built from source by the next step when this finds nothing (a few minutes).
      - name: Restore the SPIR-V LLVM translator
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.SPIRV_TRANSLATOR }}
          key: spirv-llvm-translator-${{ hashFiles('tools/ci/setup-ubuntu-24.04.sh', 'tools/ci/ubuntu-24.04-packages.txt') }}

      - name: Install the build tools (tools/ci/setup-ubuntu-24.04.sh)
        run: |
          bash tools/ci/setup-ubuntu-24.04.sh "$SPIRV_TRANSLATOR" 3>> "$GITHUB_ENV"
          make toolchain

      # A pull request's artifact is named by its number and its own commit (github.sha is a
      # temporary merge commit there); the version in param.json stays the release's.
      - name: Name this build
        id: label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-${PR_HEAD:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=ProsperoEden" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/downloads
          key: downloads-${{ hashFiles('tools/deps.json') }}

      - name: Fetch dependencies
        run: make deps

      # After `make deps`: a restored RADV folder would otherwise stand in for the git checkout
      # it lives in, and deps.py would not fetch that checkout. With the driver go the Payload
      # SDK and zlib its build sets up beside it: the final link takes libraries from that SDK.
      - name: Restore the RADV driver
        id: radv
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.RADV_NATIVE }}/radv-release
            ${{ env.RADV_NATIVE }}/ps5-payload-sdk
            ${{ env.RADV_NATIVE }}/zlib
            build/radv-isolated
          key: radv-3-${{ hashFiles('tools/deps.json', 'tools/patch-radv-wsi.py', 'tools/build-radv-dependencies.sh', 'tools/isolate-radv.py', 'tools/ci/ubuntu-24.04-packages.txt', 'tools/ci/setup-ubuntu-24.04.sh') }}

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/ccache
          key: ccache-u24-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-u24-

      # No ccache from GitHub's cache (expired, or none on main yet): start from the snapshot.
      # The file's name carries the cache key's prefix, so a new toolchain starts a new file.
      - name: Fetch the ccache snapshot
        if: steps.ccache.outputs.cache-matched-key == ''
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/build-cache/ccache-u24.tar"
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache-u24.tar" "$url"; then
            mkdir -p "$CCACHE_DIR"
            tar -xf "$RUNNER_TEMP/ccache-u24.tar" -C "$CCACHE_DIR"
            rm "$RUNNER_TEMP/ccache-u24.tar"
            echo "::notice title=ccache::Started from the build-cache snapshot ($(du -sh "$CCACHE_DIR" | cut -f1))."
          else
            echo "::notice title=ccache::No snapshot to start from; this run compiles everything."
          fi

      - name: Build and package
        id: build
        timeout-minutes: 315
        run: |
          ccache --zero-stats
          bash tools/ci/build-release.sh

      - name: Report disk, ccache and the linker
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          ccache --show-stats || true
          "$(dirname "$GITHUB_WORKSPACE")/ps5-native-app-boilerplate/.deps/native/ps5-payload-sdk/bin/prospero-lld" --version || true

      # A pull request that built reuses main's ccache and saves none of its own (the
      # repository's cache space is limited); one that stopped early saves it to continue.
      - name: Save ccache
        if: always() && (github.event_name != 'pull_request' || steps.build.outcome != 'success')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CACHE_ROOT }}/ccache
          key: ccache-u24-${{ github.run_id }}-${{ github.run_attempt }}

      # ccache compresses what it stores, so the snapshot is a plain tar.
      - name: Pack the ccache snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot && steps.build.outcome == 'success'
        run: tar -cf "$RUNNER_TEMP/ccache-u24.tar" -C "$CCACHE_DIR" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot && steps.build.outcome == 'success'
        with:
          name: ccache-snapshot
          path: ${{ runner.temp }}/ccache-u24.tar
          if-no-files-found: error
          retention-days: 1

      - name: Save the RADV driver
        if: always() && steps.radv.outputs.cache-hit != 'true' && hashFiles('build/radv-isolated/libvulkan_radeon.ps5.a') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.RADV_NATIVE }}/radv-release
            ${{ env.RADV_NATIVE }}/ps5-payload-sdk
            ${{ env.RADV_NATIVE }}/zlib
            build/radv-isolated
          key: radv-3-${{ hashFiles('tools/deps.json', 'tools/patch-radv-wsi.py', 'tools/build-radv-dependencies.sh', 'tools/isolate-radv.py', 'tools/ci/ubuntu-24.04-packages.txt', 'tools/ci/setup-ubuntu-24.04.sh') }}

      - name: Match the tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test -f "dist/ProsperoEden-${GITHUB_REF_NAME}.zip"

      # tools/ci/make-dist.py writes every entry as 0777 (the console only starts an app whose
      # files are open to all); this looks at the finished file once more.
      - name: Check the ZIP and its checksum
        run: |
          set -euo pipefail
          cd dist
          python3 - ProsperoEden-v*.zip <<'PY'
          import json, sys, zipfile
          assert len(sys.argv) == 2, f"expected one ZIP: {sys.argv[1:]}"
          archive = sys.argv[1]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert "PPSA99008/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              version = json.loads(z.read("PPSA99008/sce_sys/param.json"))["contentVersion"]
              assert archive == f"ProsperoEden-v{version.removeprefix('0')}.zip", (archive, version)
              print(f"{archive}: {len(names)} entries, all 0777, version {version}")
          PY
          sha256sum -c SHA256SUMS

      # Signed provenance: this ZIP was built by this workflow from this commit. Anyone can check a
      # downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release ZIP
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ProsperoEden-v*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # The unstripped executable that reads this build's crash reports (docs/BUILDING.md). The
      # runner is discarded after the job, so it is kept as an artifact; it is not published.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.label.outputs.artifact }}-symbols
          path: build/symbols/
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ProsperoEden
          path: dist

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The names of the files of the tag's release, when there is one (a draft counts).
          if ! assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); then
            # No release yet: this run makes it.
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "ProsperoEden $GITHUB_REF_NAME" --notes-file dist/release-notes.md \
              "dist/ProsperoEden-$GITHUB_REF_NAME.zip" dist/SHA256SUMS
          elif grep -qi '\.zip$' <<< "$assets"; then
            # A published ZIP is never replaced or deleted: the catalog at homebrew.page records
            # each release ZIP's checksum.
            echo "::warning title=Release files not from this run::A release for $GITHUB_REF_NAME already has a ZIP; it was not replaced. Its files were not published by this run and may have no attestation."
          else
            # A release written in advance (notes only, or a draft): it gets this run's files;
            # its title, notes and state stay as they are. Without --clobber, nothing is replaced.
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              "dist/ProsperoEden-$GITHUB_REF_NAME.zip" dist/SHA256SUMS
            echo "::notice title=Files added to the existing release::The release for $GITHUB_REF_NAME had no ZIP; this run's ZIP and SHA256SUMS were added. Its title and notes were not changed."
          fi
